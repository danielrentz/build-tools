name: Build pnpm package
description: Sets up pnpm and nodejs, then runs audit, peers check, build, lint, and test.

inputs:
  node-version:
    description: The nodejs version to be installed
    default: "24"

runs:
  using: composite
  steps:
    # downloads from GitHub instead of nodejs.org, which is often too slow for pnpm's fetch timeout
    - name: Setup nodejs
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    # no runtime input, uses the nodejs installed in the previous step
    - name: Setup pnpm
      uses: pnpm/setup@v2

    - shell: bash
      run: pnpm audit
    - shell: bash
      run: pnpm peers check
    - shell: bash
      run: pnpm build
    - shell: bash
      run: pnpm lint
    - shell: bash
      run: pnpm test
